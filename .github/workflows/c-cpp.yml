name: Build, Test, Tidy, Format

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: make
        run: make
      - name: make test
        run: make test
      - name: make test-format
        run: make test-format
      - name: make test-tidy
        run: make test-tidy
